name: SSK ERP Production CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  backend-gate:
    name: Backend Tests, Migrations & Security Gates
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest pytest-asyncio pytest-xdist anyio httpx ruff

      - name: Python Code Quality & Lint Gate
        run: |
          ruff check backend/ --ignore E501,F401,F841 || true

      - name: Validate MongoDB Migrations Runner (DB-002, DB-004)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ssk_ci_db
          PYTHONPATH: backend
        run: |
          python backend/db/migrations/runner.py

      - name: Run Full Backend Test Suite (TEST-026, OPS-020)
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ssk_ci_db
          JWT_SECRET: supersecretjwtkey12345!supersecretjwtkey12345!
          ENVIRONMENT: test
          COOKIE_SECURE: "false"
          DISABLE_LOGIN_RATE_LIMIT: "false"
          ADMIN_EMAIL: admin@sskfootcare.com
          ADMIN_PASSWORD: Admin@123
          REACT_APP_BACKEND_URL: http://127.0.0.1:8000
          PYTHONPATH: backend
        run: |
          python -m uvicorn server:app --app-dir backend --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
          SERVER_PID=$!
          echo "Waiting for live backend server to start on port 8000..."
          READY=0
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:8000/healthz > /dev/null; then
              echo "Backend server is up and healthy after ${i}s!"
              READY=1
              break
            fi
            sleep 1
          done
          if [ $READY -ne 1 ]; then
            echo "ERROR: Backend server failed to start within 30s. Logs:"
            cat /tmp/uvicorn.log
            exit 1
          fi

          python -m pytest backend/tests/ -v --ignore=backend/tests/fixtures
          TEST_EXIT_CODE=$?
          kill -9 $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT_CODE

  supabase-validation:
    name: Supabase Migrations & Declarative Schema Validation (DB-003)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.22.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Supabase Schema (Dry-run / lint)
        run: |
          supabase db lint --level error || true

  frontend-gate:
    name: Frontend Quality, Unit Tests & Production Build (OPS-020, OPS-022)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Run Frontend Tests (OPS-020)
        run: |
          cd frontend
          CI=true npm test -- --watchAll=false --passWithNoTests

      - name: Build Production Frontend Bundle
        run: |
          cd frontend
          npm run build
        env:
          CI: false
