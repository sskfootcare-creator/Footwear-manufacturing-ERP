name: SSK ERP CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-test:
    name: Backend Tests & Core Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio pytest-xdist anyio httpx

      - name: Run Backend RBAC & Core Tests
        env:
          MONGO_URL: mongodb://localhost:27017
          DB_NAME: ssk_test_db
          JWT_SECRET: supersecretjwtkey12345!supersecretjwtkey12345!
          ENVIRONMENT: test
        run: |
          pytest backend/tests/test_modular_rbac.py backend/tests/test_jwt_claims.py backend/tests/test_cors_security.py

  frontend-build:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Frontend
        run: |
          cd frontend
          npm run build
        env:
          CI: false
